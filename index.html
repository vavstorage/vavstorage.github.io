<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAV File Viewer</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 12px 20px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }
    .header-info {
      flex: 1;
    }
    h1 {
      font-size: 1.2rem;
      margin: 0 0 4px 0;
    }
    #file-name {
      color: #00e676;
      font-weight: bold;
      font-size: 0.9rem;
      margin: 0;
    }
    #file-input {
      background: #2a2a2a;
      color: #fff;
      padding: 6px 12px;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
    }
    #app-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>
  
  <iframe id="app-frame" title="VAV App Output"></iframe>

  <script src="app.js"></script>
</body>
</html>
